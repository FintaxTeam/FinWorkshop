services:
  odoo-db:
    image: postgres:15-alpine
    container_name: fintax-odoo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo_local
    ports:
      - "5433:5432"
    volumes:
      - odoo-postgres-data:/var/lib/postgresql/data
      - ./infrastructure/odoo-docker/init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  odoo:
    image: odoo:16.0
    container_name: fintax-odoo
    restart: unless-stopped
    depends_on:
      odoo-db:
        condition: service_healthy
    command: ["odoo", "-d", "fintax_clean", "--db-filter=^fintax_clean$", "--no-database-list", "--addons-path=/mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons"]
    ports:
      - "8069:8069"
      - "8070:8069"
    environment:
      HOST: odoo-db
      USER: odoo
      PASSWORD: odoo_local
    volumes:
      - ./infrastructure/odoo-docker/extra-addons:/mnt/extra-addons
      - odoo-web-data:/var/lib/odoo

  mock-tax-api:
    build:
      context: .
      dockerfile: apps/mock-tax-api/Dockerfile
    container_name: fintax-mock-tax
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000

  middleware-api:
    build:
      context: .
      dockerfile: apps/middleware-api/Dockerfile
    container_name: fintax-middleware-api
    restart: unless-stopped
    depends_on:
      odoo-db:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DB_HOST: odoo-db
      DB_PORT: 5432
      DB_USER: odoo
      DB_PASSWORD: odoo_local
      DB_NAME: finworkshop
      JWT_SECRET: finworkshop-super-secret-jwt-key-change-in-production
      DEMO_PASSWORD: FinTax@2026
      TAX_API_URL: http://mock-tax-api:4000
      WEB_ORIGIN: "*"
      ODOO_URL: http://odoo:8069
      SEED_DEMO_DATA: "true"
      ODOO_SYNC_WORKER: "true"
      WORKSHOP_TIME_ZONE: Asia/Ho_Chi_Minh

  web-client:
    build:
      context: .
      dockerfile: apps/web-client/Dockerfile
    container_name: fintax-web-client
    restart: unless-stopped
    depends_on:
      - middleware-api
    ports:
      - "80:80"
      - "5173:80"
      - "8080:80"

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: fintax-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - web-client

volumes:
  odoo-postgres-data:
  odoo-web-data:
